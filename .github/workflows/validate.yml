name: Validate all native targets
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: android
            command: flutter build apk --release
          - os: ubuntu-latest
            target: linux
            command: flutter build linux --release
          - os: windows-latest
            target: windows
            command: flutter build windows --release
          - os: macos-latest
            target: macos
            command: flutter build macos --release
          - os: macos-latest
            target: ios
            command: flutter build ios --release --no-codesign
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Install Linux libraries
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libmpv-dev
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - run: ${{ matrix.command }}
